name: Validate knowledge

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/build.mjs --check
      - run: node --test scripts/*.test.mjs
      - name: Verify generated data
        run: |
          node scripts/build.mjs --out "$RUNNER_TEMP/security-data"
          diff -ru data "$RUNNER_TEMP/security-data"
