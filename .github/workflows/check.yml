name: Validate knowledge

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: node scripts/build.mjs --check
      - run: node --test scripts/*.test.mjs
      - run: node scripts/report.mjs examples/public-repository-review.json
      - name: Verify generated data
        run: |
          node scripts/build.mjs --out "$RUNNER_TEMP/security-data"
          diff -ru data "$RUNNER_TEMP/security-data"
